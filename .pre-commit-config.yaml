repos:
  -   repo: https://github.com/pycqa/isort
      rev: 9.0.0a3
      hooks:
        - id: isort
          language_version: python3
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args:
          - --py310-plus
  -   repo: https://github.com/psf/black-pre-commit-mirror
      rev: 26.5.1
      hooks:
        - id: black
          language_version: python3
  -   repo: https://github.com/PyCQA/flake8
      rev: 7.3.0
      hooks:
        - id: flake8
          language_version: python3
  # mypy runs via `uv run --group typecheck`, so the type stubs live in the
  # `typecheck` dependency group (pyproject.toml) rather than being duplicated
  # here as additional_dependencies.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        language: system
        entry: uv run --group typecheck mypy
        pass_filenames: false
        always_run: true
        types_or: [python, pyi]

ci:
  # To trigger manually, comment on a pull request with "pre-commit.ci autofix"
  autofix_prs: false
  autoupdate_schedule: "monthly"
  # mypy is a `language: system` hook needing uv + the repo's dependency
  # groups, which are unavailable on pre-commit.ci runners; run it in CI instead.
  skip: [mypy]
