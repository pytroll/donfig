[build-system]
requires = ["setuptools>=62.6", "versioneer[toml]==0.28"]
build-backend = "setuptools.build_meta"

[project]
name = "donfig"
description = "Python package for configuring a python package"
maintainers = [{name = "David Hoese", email = "david.hoese@ssec.wisc.edu"}]
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE.txt", "DASK_LICENSE.txt"]
keywords = ["task-scheduling parallel numpy pandas pydata"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering",
]
readme = "README.rst"
urls = {Homepage = "https://github.com/pytroll/donfig"}
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest",
    "cloudpickle",
]
docs = [
    "sphinx>=4.0.0",
    "numpydoc",
    "pytest",
    "cloudpickle",
]

# Type-checking toolchain (PEP 735 dependency group): mypy plus the type stubs.
# This is the single source of truth for the stubs — the pre-commit mypy hook
# runs `uv run --group typecheck mypy` rather than duplicating the list.
[dependency-groups]
typecheck = [
    "mypy",
    "types-docutils",
    "types-PyYAML",
    "types-setuptools",
    "pytest",  # so the test suite type-checks against real pytest types
    "cloudpickle",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages]
find = { namespaces = false }

[tool.mypy]
python_version = "3.10"
# See https://github.com/python/mypy/issues/12286 for automatic multi-platform support
platform = "linux"
# platform = win32
# platform = darwin
strict = true
allow_untyped_decorators = false
ignore_missing_imports = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# `donfig/version.py` is generated by versioneer; do not type-check it.
[[tool.mypy.overrides]]
module = "donfig.version"
ignore_errors = true

[tool.black]
line-length = 120
exclude = '''
(
  \.git
  | build
  | dist
  | donfig/version\.py
)

'''

[tool.isort]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
profile = "black"
skip_gitignore = true
force_to_top = ["true"]
default_section = "THIRDPARTY"
known_first_party = ["donfig"]
skip = ["donfig/version.py"]

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "donfig/version.py"
versionfile_build = "donfig/version.py"
tag_prefix = "v"

[tool.coverage.run]
omit = ["donfig/version.py", "versioneer.py"]
