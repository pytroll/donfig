[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "donfig"
description = "Python package for configuring a python package"
maintainers = [{name = "David Hoese", email = "david.hoese@ssec.wisc.edu"}]
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE.txt", "DASK_LICENSE.txt"]
keywords = ["task-scheduling parallel numpy pandas pydata"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering",
]
readme = "README.rst"
urls = {Homepage = "https://github.com/pytroll/donfig"}
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest",
    "cloudpickle",
]
docs = [
    "sphinx>=4.0.0",
    "numpydoc",
    "pytest",
    "cloudpickle",
]

# Local development dependency groups (PEP 735). Preferred over extras for tools
# like uv/hatch; the extras above are retained for `pip install donfig[docs]`
# (e.g. Read the Docs).
[dependency-groups]
test = ["pytest", "cloudpickle"]
docs = ["sphinx>=4.0.0", "numpydoc", "pytest", "cloudpickle"]
dev = [{ include-group = "test" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["donfig"]

# `hatch run test:run` — an easy task runner for new contributors.
[tool.hatch.envs.test]
features = ["test"]

[tool.hatch.envs.test.scripts]
run = "pytest {args:--cov=donfig donfig}"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["donfig"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
xfail_strict = true
log_cli_level = "INFO"
log_level = "INFO"
filterwarnings = ["error"]

[tool.repo-review]
ignore = [
    # donfig ships docs under `doc/` and keeps tests inside the package
    # (`donfig/tests/`) rather than a src-layout; both are intentional.
    "PY004",
    "PY005",
    # MyPy strictness is tightened in a separate typing PR, not here.
    "MY101",
    "MY102",
    "MY104",
    "MY105",
    "MY106",
    # Adding the doc/markdown formatters (blacken-docs etc.) is out of scope for
    # this packaging change.
    "PC111",
    "PC170",
    "PC180",
]

[tool.mypy]
python_version = "3.10"
# See https://github.com/python/mypy/issues/12286 for automatic multi-platform support
platform = "linux"
# platform = win32
# platform = darwin
allow_untyped_decorators = false
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
warn_unused_configs = true

[tool.codespell]
# Vendored, minified js-yaml bundle used by the docs config converter — not prose.
skip = "doc/_static/js-yaml.min.js"
# `THIRDPARTY` is a required isort section keyword, not a misspelling.
ignore-words-list = "thirdparty"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E/W/F replace flake8, I replaces isort, UP replaces pyupgrade (the target
# version is inferred from requires-python), and B adds flake8-bugbear.
select = ["B", "E", "F", "I", "UP", "W"]
ignore = [
    "E721", # type comparisons
    "E731", # lambda assignment
    "E741", # ambiguous variable names
]

[tool.ruff.lint.per-file-ignores]
# flake8 excluded __init__.py entirely; keep its re-export/import-order latitude.
"**/__init__.py" = ["E402", "F401", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["donfig"]
