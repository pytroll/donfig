[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "donfig"
description = "Python package for configuring a python package"
maintainers = [{name = "David Hoese", email = "david.hoese@ssec.wisc.edu"}]
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE.txt", "DASK_LICENSE.txt"]
keywords = ["task-scheduling parallel numpy pandas pydata"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering",
]
readme = "README.rst"
urls = {Homepage = "https://github.com/pytroll/donfig"}
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest",
    "cloudpickle",
]
docs = [
    "sphinx>=4.0.0",
    "numpydoc",
    "pytest",
    "cloudpickle",
]

# Local development dependency groups (PEP 735). Preferred over extras for tools
# like uv/hatch; the extras above are retained for `pip install donfig[docs]`
# (e.g. Read the Docs).
[dependency-groups]
test = ["pytest", "cloudpickle"]
docs = ["sphinx>=4.0.0", "numpydoc", "pytest", "cloudpickle"]
dev = [{ include-group = "test" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["donfig"]

# `hatch run test:run` — an easy task runner for new contributors.
[tool.hatch.envs.test]
features = ["test"]

[tool.hatch.envs.test.scripts]
run = "pytest {args:--cov=donfig donfig}"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["donfig"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
xfail_strict = true
log_cli_level = "INFO"
log_level = "INFO"
filterwarnings = ["error"]

[tool.repo-review]
ignore = [
    # donfig ships docs under `doc/` and keeps tests inside the package
    # (`donfig/tests/`) rather than a src-layout; both are intentional.
    "PY004",
    "PY005",
    # MyPy strictness is tightened in a separate typing PR, not here.
    "MY101",
    "MY102",
    "MY104",
    "MY105",
    "MY106",
    # donfig lints with isort + black + flake8 + pyupgrade; migrating to Ruff and
    # the extra doc/markdown formatters is out of scope for this packaging change.
    "RF001",
    "PC111",
    "PC170",
    "PC180",
]

[tool.mypy]
python_version = "3.10"
# See https://github.com/python/mypy/issues/12286 for automatic multi-platform support
platform = "linux"
# platform = win32
# platform = darwin
allow_untyped_decorators = false
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
warn_unused_configs = true

[tool.black]
line-length = 120
exclude = '''
(
  \.git
  | build
  | dist
)

'''

[tool.isort]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
profile = "black"
skip_gitignore = true
force_to_top = ["true"]
default_section = "THIRDPARTY"
known_first_party = ["donfig"]
