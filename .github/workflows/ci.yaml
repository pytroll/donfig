name: CI

on: [push, pull_request]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs needs the full history to resolve the version when uv
          # builds the project environment
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Run mypy
        run: uv run --group typecheck mypy donfig

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: ["windows-latest", "ubuntu-latest", "macos-latest"]
        python-version: ["3.10"]

    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      OS: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Conda Environment
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4
        with:
          environment-file: continuous_integration/environment.yaml
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true

      - name: Install Donfig
        shell: bash -l {0}
        run: |
          pip install --no-deps -e .

      - name: Run unit tests on non-Windows
        shell: bash -l {0}
        run: |
          pytest --cov=donfig donfig --cov-report=xml
        if: runner.os != 'Windows'

      - name: Run unit tests on Windows
        shell: powershell
        run: |
          pytest --cov=donfig donfig --cov-report=xml
        if: runner.os == 'Windows'

      - name: Upload unittest coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: unittests
          files: ./coverage.xml
          env_vars: OS,PYTHON_VERSION,UNSTABLE
